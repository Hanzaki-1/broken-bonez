<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>Broken Bonez</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    touch-action:none;
    font-family:Arial,Helvetica,sans-serif;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#77c9ed;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

/* =========================
   ARCADE HUD
========================= */

#hud{
    position:absolute;
    top:8px;
    left:8px;
    right:8px;

    display:flex;
    justify-content:space-between;

    pointer-events:none;
    z-index:10;

    font-family:monospace;
    font-weight:900;
}

.hud{
    background:#101010;
    border:3px solid #f5f5f5;

    box-shadow:
        4px 4px 0 #000;

    padding:5px 9px;

    min-width:95px;

    color:#fff;
}

.label{
    font-size:9px;
    color:#aaa;
    letter-spacing:1px;
}

.value{
    font-size:19px;
    line-height:20px;
    color:#fff;
}

/* =========================
   TITLE
========================= */

#titleLogo{

    position:absolute;

    top:50px;
    left:50%;

    transform:translateX(-50%);

    z-index:5;

    font-family:Impact,
    Haettenschweiler,
    sans-serif;

    font-size:clamp(30px,8vw,62px);

    letter-spacing:2px;

    color:#f7e11b;

    -webkit-text-stroke:
        3px #111;

    text-shadow:
        5px 5px 0 #e83b22,
        8px 8px 0 #111;

    white-space:nowrap;

    pointer-events:none;
}

/* =========================
   MESSAGE
========================= */

#message{

    position:absolute;

    top:24%;
    left:50%;

    transform:translate(-50%,-50%);

    z-index:20;

    color:#fff;

    font-family:Impact,
    Haettenschweiler,
    sans-serif;

    font-size:30px;

    text-align:center;

    white-space:nowrap;

    text-shadow:
        3px 3px 0 #111,
        -2px -2px 0 #111;

    opacity:0;

    pointer-events:none;
}

/* =========================
   START SCREEN
========================= */

#overlay{

    position:absolute;

    inset:0;

    z-index:50;

    display:flex;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    background:
        linear-gradient(
            rgba(20,20,20,.5),
            rgba(20,20,20,.78)
        );

    color:#fff;

    text-align:center;
}

#overlay h1{

    font-family:Impact,
    Haettenschweiler,
    sans-serif;

    font-size:clamp(45px,12vw,90px);

    color:#f5e51b;

    -webkit-text-stroke:
        3px #111;

    text-shadow:
        6px 6px 0 #e43c24,
        10px 10px 0 #000;

    letter-spacing:2px;

    margin-bottom:10px;
}

#overlay .subtitle{

    font-family:monospace;

    font-size:14px;

    line-height:22px;

    margin-bottom:28px;

    max-width:330px;
}

#startBtn{

    border:4px solid #111;

    background:#f3d51b;

    color:#111;

    padding:15px 34px;

    font-family:Impact,
    Haettenschweiler,
    sans-serif;

    font-size:25px;

    box-shadow:
        6px 6px 0 #000;

    cursor:pointer;

    touch-action:manipulation;
}

#startBtn:active{

    transform:translate(
        4px,
        4px
    );

    box-shadow:
        2px 2px 0 #000;
}

/* =========================
   MOBILE CONTROLS
========================= */

#controls{

    position:absolute;

    left:0;
    right:0;
    bottom:12px;

    z-index:20;

    display:flex;

    justify-content:space-between;

    padding:0 12px;

    pointer-events:none;
}

.controlSide{

    display:flex;

    gap:9px;

    pointer-events:auto;
}

.control{

    width:68px;
    height:68px;

    border:3px solid #111;

    background:#e7e7e7;

    color:#111;

    font-size:25px;

    font-weight:900;

    box-shadow:
        5px 5px 0 #111;

    touch-action:none;

    display:flex;

    align-items:center;

    justify-content:center;
}

.control.trick{

    background:#ef3e25;

    color:#fff;
}

.control.jump{

    background:#f1d51c;
}

.control:active,
.control.active{

    transform:
        translate(4px,4px);

    box-shadow:
        1px 1px 0 #111;
}

/* =========================
   HELP
========================= */

#hint{

    position:absolute;

    bottom:92px;

    left:50%;

    transform:translateX(-50%);

    z-index:10;

    background:rgba(0,0,0,.65);

    color:white;

    font-family:monospace;

    font-size:10px;

    padding:5px 8px;

    border:2px solid #fff;

    pointer-events:none;

    white-space:nowrap;
}

@media(max-height:600px){

    #hint{
        display:none;
    }

    .control{
        width:58px;
        height:58px;
    }

    #titleLogo{
        top:42px;
    }

}

</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="titleLogo">
BROKEN BONEZ
</div>

<div id="hud">

    <div class="hud">
        <div class="label">SCORE</div>
        <div class="value"
             id="score">
            0
        </div>
    </div>

    <div class="hud">
        <div class="label">BONEZ</div>
        <div class="value"
             id="bonez">
            0 / 5
        </div>
    </div>

    <div class="hud">
        <div class="label">DISTANCE</div>
        <div class="value"
             id="distance">
            0
        </div>
    </div>

</div>

<div id="message"></div>

<div id="hint">
LAND ON YOUR WHEELS
</div>

<!-- MOBILE CONTROLS -->

<div id="controls">

    <div class="controlSide">

        <button
            class="control"
            id="leftBtn">
            ◀
        </button>

        <button
            class="control"
            id="rightBtn">
            ▶
        </button>

    </div>

    <div class="controlSide">

        <button
            class="control jump"
            id="jumpBtn">
            ▲
        </button>

        <button
            class="control trick"
            id="trickBtn">
            ↻
        </button>

    </div>

</div>

<!-- START -->

<div id="overlay">

    <h1>
        BROKEN BONEZ
    </h1>

    <div class="subtitle">

        HIT THE RAMPS<br>
        GO CRAZY IN THE AIR<br>
        LAND ON YOUR WHEELS

    </div>

    <button id="startBtn">
        START GAME
    </button>

</div>

</div>


<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let W;
let H;
let groundY;

function resize(){

    W =
        window.innerWidth;

    H =
        window.innerHeight;

    canvas.width =
        W * devicePixelRatio;

    canvas.height =
        H * devicePixelRatio;

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );

    groundY =
        H * .76;
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   GAME
========================================================= */

let running = false;

let score = 0;

let bonez = 0;

let distance = 0;

let cameraX = 0;

let lastTime = 0;

let ramps = [];

let particles = [];

let previousJump = false;


/* =========================================================
   CONTROLS
========================================================= */

const keys = {

    left:false,
    right:false,
    jump:false,
    trick:false

};


function button(id,key){

    const el =
        document.getElementById(id);

    el.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();

            keys[key]=true;

            el.classList.add(
                "active"
            );
        }
    );

    el.addEventListener(
        "pointerup",
        e=>{

            e.preventDefault();

            keys[key]=false;

            el.classList.remove(
                "active"
            );
        }
    );

    el.addEventListener(
        "pointercancel",
        e=>{

            keys[key]=false;

            el.classList.remove(
                "active"
            );
        }
    );

    el.addEventListener(
        "pointerleave",
        e=>{

            keys[key]=false;

            el.classList.remove(
                "active"
            );
        }
    );
}

button("leftBtn","left");
button("rightBtn","right");
button("jumpBtn","jump");
button("trickBtn","trick");


/* KEYBOARD */

window.addEventListener(
    "keydown",
    e=>{

        if(e.code==="ArrowLeft")
            keys.left=true;

        if(e.code==="ArrowRight")
            keys.right=true;

        if(
            e.code==="ArrowUp" ||
            e.code==="Space"
        )
            keys.jump=true;

        if(
            e.code==="KeyX" ||
            e.code==="ShiftLeft"
        )
            keys.trick=true;
    }
);

window.addEventListener(
    "keyup",
    e=>{

        if(e.code==="ArrowLeft")
            keys.left=false;

        if(e.code==="ArrowRight")
            keys.right=false;

        if(
            e.code==="ArrowUp" ||
            e.code==="Space"
        )
            keys.jump=false;

        if(
            e.code==="KeyX" ||
            e.code==="ShiftLeft"
        )
            keys.trick=false;
    }
);


/* =========================================================
   BIKE
========================================================= */

const bike = {

    x:150,

    y:0,

    vx:4,

    vy:0,

    angle:0,

    angularVelocity:0,

    onGround:true,

    airborne:false,

    airTime:0,

    trickRotation:0,

    wheelSpin:0,

    width:78,

    height:40
};


/* =========================================================
   RAMP GENERATION
========================================================= */

function randomGap(){

    /*
        Random but NEVER ridiculous.

        Most ramps:
        220 - 360 px

        This keeps the rolling loop
        playable on mobile.
    */

    return 220 +
        Math.random()*140;
}


function createRamp(x){

    ramps.push({

        x:x,

        width:
            100+
            Math.random()*35,

        height:
            35+
            Math.random()*22
    });
}


function generateRamps(){

    while(

        ramps.length<10 ||

        ramps[ramps.length-1].x
        <
        cameraX+W+500

    ){

        let x;

        if(ramps.length===0){

            x=430;

        }else{

            const last =
                ramps[
                    ramps.length-1
                ];

            x =
                last.x+
                last.width+
                randomGap();
        }

        createRamp(x);
    }
}


function cleanupRamps(){

    ramps =
        ramps.filter(
            r =>
            r.x+r.width
            >
            cameraX-500
        );
}


/* =========================================================
   RAMP SURFACE
========================================================= */

function getSurface(x){

    for(
        const r of ramps
    ){

        if(
            x>=r.x &&
            x<=r.x+r.width
        ){

            const p =
                (x-r.x)/
                r.width;

            const y =
                groundY-
                Math.sin(
                    p*Math.PI/2
                )*
                r.height;

            return {

                y:y,
                ramp:r
            };
        }
    }

    return null;
}


/* =========================================================
   JUMP
========================================================= */

function jump(){

    if(
        keys.jump &&
        !previousJump &&
        bike.onGround
    ){

        bike.vy=-11;

        bike.onGround=false;

        bike.airborne=true;

        bike.airTime=0;

        bike.trickRotation=0;

        particle(
            bike.x,
            bike.y+20,
            8
        );
    }

    previousJump =
        keys.jump;
}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

    jump();


    /*
        Forward acceleration
    */

    bike.vx +=
        .012*dt*60;

    bike.vx =
        Math.min(
            bike.vx,
            7.5
        );


    /*
        AIR LEAN

        Gentle like previous version.
    */

    if(bike.airborne){

        if(keys.left){

            bike.angularVelocity -=
                .00035*
                dt*
                60;
        }

        if(keys.right){

            bike.angularVelocity +=
                .00035*
                dt*
                60;
        }

        bike.angularVelocity =
            Math.max(
                -.0025,
                Math.min(
                    .0025,
                    bike.angularVelocity
                )
            );
    }


    /*
        TRICK

        Continuous 360+
    */

    if(
        bike.airborne &&
        keys.trick
    ){

        const spin =
            .12*
            dt*
            60;

        bike.trickRotation +=
            spin;

        bike.angle +=
            spin;
    }


    bike.angle +=
        bike.angularVelocity*
        dt*
        60;


    /*
        Gravity
    */

    bike.vy +=
        .45*
        dt*
        60;

    bike.x +=
        bike.vx*
        dt*
        60;

    bike.y +=
        bike.vy*
        dt*
        60;


    if(bike.airborne){

        bike.airTime +=
            dt;
    }


    checkLanding();


    /*
        CAMERA
    */

    const target =
        bike.x-
        W*.30;

    cameraX +=
        (target-cameraX)*
        .08;


    distance =
        Math.max(
            distance,
            (bike.x-150)/10
        );


    bike.wheelSpin +=
        bike.vx*
        dt*
        .8;


    updateParticles();


    generateRamps();

    cleanupRamps();
}


/* =========================================================
   LANDING
========================================================= */

function checkLanding(){

    const rear =
        getSurface(
            bike.x-28
        );

    const front =
        getSurface(
            bike.x+28
        );

    let surface=null;

    if(rear)
        surface=rear;

    if(front)
        surface=front;


    if(!surface){

        if(
            bike.y+
            bike.height/2
            >=groundY &&
            bike.vy>=0
        ){

            land(
                groundY
            );
        }

        return;
    }


    if(
        bike.y+
        bike.height/2
        >=surface.y &&
        bike.vy>=0
    ){

        land(
            surface.y
        );
    }
}


/* =========================================================
   LAND
========================================================= */

function land(y){

    const normalized =
        Math.atan2(
            Math.sin(
                bike.angle
            ),
            Math.cos(
                bike.angle
            )
        );


    /*
        Wheels must be reasonably
        close to upright.
    */

    const safe =
        Math.abs(
            normalized
        )<.65;


    if(!safe){

        crash();

        return;
    }


    bike.y =
        y-
        bike.height/2;

    bike.vy=0;

    bike.onGround=true;

    bike.airborne=false;

    bike.angularVelocity*=.2;


    /*
        COUNT COMPLETE ROTATIONS
    */

    const rotations =
        Math.floor(
            Math.abs(
                bike.trickRotation
            )/
            (Math.PI*2)
        );


    if(rotations>0){

        let points;

        if(rotations===1){

            points=500;

        }else if(rotations===2){

            points=1000;

        }else if(rotations===3){

            points=2000;

        }else{

            points=
                2000+
                (rotations-3)*1000;
        }


        score +=
            points;

        showMessage(
            rotations+
            "X SPIN  +"+
            points
        );

    }else{

        /*
            Canonical normal landing
            shown in the episode = 10.
        */

        score+=10;

        showMessage(
            "LAND +10"
        );
    }


    particle(
        bike.x,
        y,
        12
    );


    bike.trickRotation=0;
}


/* =========================================================
   CRASH
========================================================= */

function crash(){

    bonez++;

    /*
        Negative points are possible
        in the original game.
    */

    score-=100;

    bike.airborne=true;

    bike.onGround=false;

    bike.vy=-5;

    bike.angularVelocity =
        (
            Math.random()>.5
            ?1
            :-1
        )*.025;

    particle(
        bike.x,
        bike.y,
        25
    );

    showMessage(
        "BROKEN BONEZ!"
    );

    updateHUD();


    if(bonez>=5){

        setTimeout(
            gameOver,
            700
        );
    }
}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver(){

    running=false;

    document
        .getElementById("overlay")
        .style.display="flex";

    document
        .querySelector(
            "#overlay h1"
        )
        .textContent=
        "GAME OVER";

    document
        .querySelector(
            "#overlay .subtitle"
        )
        .innerHTML=
        `
        BROKEN BONEZ: 5<br>
        SCORE: ${Math.floor(score)}<br>
        DISTANCE: ${Math.floor(distance)}
        `;

    document
        .getElementById(
            "startBtn"
        )
        .textContent=
        "PLAY AGAIN";
}


/* =========================================================
   MESSAGE
========================================================= */

let messageTimer;

function showMessage(text){

    const el =
        document.getElementById(
            "message"
        );

    el.textContent=text;

    el.style.opacity=1;

    clearTimeout(
        messageTimer
    );

    messageTimer=
        setTimeout(
            ()=>{

                el.style.opacity=0;

            },
            700
        );
}


/* =========================================================
   PARTICLES
========================================================= */

function particle(
    x,
    y,
    count
){

    for(
        let i=0;
        i<count;
        i++
    ){

        particles.push({

            x:x,

            y:y,

            vx:
                (Math.random()-.5)*6,

            vy:
                -Math.random()*5,

            life:1,

            size:
                2+
                Math.random()*4
        });
    }
}


function updateParticles(){

    for(
        const p of particles
    ){

        p.x +=
            p.vx;

        p.y +=
            p.vy;

        p.vy +=
            .25;

        p.life -=
            .025;
    }

    particles =
        particles.filter(
            p=>p.life>0
        );
}


function drawParticles(){

    for(
        const p of particles
    ){

        ctx.globalAlpha=
            p.life;

        ctx.fillStyle=
            "#e3c06b";

        ctx.fillRect(
            p.x-cameraX,
            p.y,
            p.size,
            p.size
        );
    }

    ctx.globalAlpha=1;
}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground(){

    /*
        BLUE ARCADE SKY
    */

    const sky =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    sky.addColorStop(
        0,
        "#56bde9"
    );

    sky.addColorStop(
        .65,
        "#b8e8f5"
    );

    sky.addColorStop(
        1,
        "#e7e1bc"
    );

    ctx.fillStyle=sky;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
        BIG SIMPLE CLOUDS
    */

    ctx.fillStyle=
        "rgba(255,255,255,.75)";

    for(
        let i=0;
        i<7;
        i++
    ){

        const x =
            (
                i*300-
                cameraX*.12
            )%
            (W+400);

        const y =
            105+
            (i%3)*48;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            28,
            0,
            Math.PI*2
        );

        ctx.arc(
            x+32,
            y-12,
            34,
            0,
            Math.PI*2
        );

        ctx.arc(
            x+68,
            y,
            26,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    /*
        DISTANT HILLS
    */

    ctx.fillStyle=
        "#77a85d";

    ctx.beginPath();

    ctx.moveTo(
        0,
        groundY
    );

    for(
        let x=0;
        x<=W+50;
        x+=40
    ){

        const y =
            groundY-
            75-
            Math.sin(
                (x+
                cameraX*.15)*
                .009
            )*35;

        ctx.lineTo(
            x,
            y
        );
    }

    ctx.lineTo(
        W,
        H
    );

    ctx.lineTo(
        0,
        H
    );

    ctx.closePath();

    ctx.fill();


    /*
        DIRT
    */

    ctx.fillStyle=
        "#9b673d";

    ctx.fillRect(
        0,
        groundY,
        W,
        H-groundY
    );


    /*
        DIRT STRIPES
    */

    ctx.fillStyle=
        "#75482d";

    for(
        let x=-100;
        x<W+100;
        x+=70
    ){

        const sx =
            x-
            (
                cameraX*
                .7
            )%70;

        ctx.fillRect(
            sx,
            groundY+18,
            35,
            4
        );

        ctx.fillRect(
            sx+18,
            groundY+45,
            25,
            3
        );
    }


    /*
        GRASS LINE
    */

    ctx.fillStyle=
        "#3e8a3e";

    ctx.fillRect(
        0,
        groundY-6,
        W,
        7
    );
}


/* =========================================================
   RAMPS
========================================================= */

function drawRamps(){

    for(
        const r of ramps
    ){

        const x =
            r.x-
            cameraX;


        if(
            x+r.width<-100 ||
            x>W+100
        )
            continue;


        /*
            SHADOW
        */

        ctx.fillStyle=
            "rgba(0,0,0,.2)";

        ctx.beginPath();

        ctx.moveTo(
            x+5,
            groundY+8
        );

        ctx.lineTo(
            x+r.width+10,
            groundY+8
        );

        ctx.lineTo(
            x+r.width+5,
            groundY-r.height+8
        );

        ctx.closePath();

        ctx.fill();


        /*
            RAMP BODY
        */

        ctx.fillStyle=
            "#75472b";

        ctx.beginPath();

        ctx.moveTo(
            x,
            groundY
        );

        ctx.lineTo(
            x+r.width,
            groundY
        );

        ctx.lineTo(
            x+r.width,
            groundY-r.height
        );

        ctx.closePath();

        ctx.fill();


        /*
            ORANGE TOP
        */

        ctx.strokeStyle=
            "#d18b4c";

        ctx.lineWidth=8;

        ctx.beginPath();

        ctx.moveTo(
            x,
            groundY
        );

        ctx.lineTo(
            x+r.width,
            groundY-r.height
        );

        ctx.stroke();


        /*
            BLACK OUTLINE
        */

        ctx.strokeStyle=
            "#2b1b12";

        ctx.lineWidth=4;

        ctx.beginPath();

        ctx.moveTo(
            x,
            groundY
        );

        ctx.lineTo(
            x+r.width,
            groundY-r.height
        );

        ctx.stroke();
    }
}


/* =========================================================
   BIKE
========================================================= */

function drawBike(){

    const x =
        bike.x-
        cameraX;

    const y =
        bike.y;

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        bike.angle
    );


    /*
        SHADOW
    */

    if(bike.airborne){

        ctx.fillStyle=
            "rgba(0,0,0,.25)";

        ctx.beginPath();

        ctx.ellipse(
            0,
            28+
            Math.min(
                50,
                bike.airTime*30
            ),
            34,
            6,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    /*
        REAR WHEEL
    */

    drawWheel(
        -29,
        18
    );


    /*
        FRONT WHEEL
    */

    drawWheel(
        29,
        18
    );


    /*
        BIKE FRAME
    */

    ctx.strokeStyle=
        "#151515";

    ctx.lineWidth=6;

    ctx.beginPath();

    ctx.moveTo(
        -29,
        8
    );

    ctx.lineTo(
        -7,
        -10
    );

    ctx.lineTo(
        29,
        9
    );

    ctx.lineTo(
        -29,
        8
    );

    ctx.moveTo(
        -7,
        -10
    );

    ctx.lineTo(
        12,
        8
    );

    ctx.stroke();


    /*
        RED BODY
    */

    ctx.fillStyle=
        "#e4472e";

    ctx.beginPath();

    ctx.moveTo(
        -9,
        -14
    );

    ctx.lineTo(
        14,
        -9
    );

    ctx.lineTo(
        9,
        4
    );

    ctx.lineTo(
        -14,
        2
    );

    ctx.closePath();

    ctx.fill();


    /*
        YELLOW DETAIL
    */

    ctx.fillStyle=
        "#f2d31b";

    ctx.fillRect(
        -10,
        -8,
        17,
        5
    );


    /*
        SEAT
    */

    ctx.fillStyle=
        "#111";

    ctx.fillRect(
        -13,
        -19,
        20,
        5
    );


    /*
        HANDLE
    */

    ctx.strokeStyle=
        "#111";

    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.moveTo(
        28,
        8
    );

    ctx.lineTo(
        35,
        -8
    );

    ctx.lineTo(
        44,
        -8
    );

    ctx.stroke();


    /*
        RIDER BODY
    */

    ctx.fillStyle=
        "#2f66c7";

    ctx.fillRect(
        -4,
        -34,
        17,
        22
    );


    /*
        RIDER ARM
    */

    ctx.strokeStyle=
        "#f0b78d";

    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.moveTo(
        8,
        -29
    );

    ctx.lineTo(
        29,
        -12
    );

    ctx.stroke();


    /*
        HEAD
    */

    ctx.fillStyle=
        "#eab48a";

    ctx.beginPath();

    ctx.arc(
        5,
        -42,
        9,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        HELMET
    */

    ctx.fillStyle=
        "#242424";

    ctx.beginPath();

    ctx.arc(
        5,
        -44,
        10,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();


    /*
        HELMET STRIPE
    */

    ctx.strokeStyle=
        "#f1d21c";

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.moveTo(
        -2,
        -51
    );

    ctx.lineTo(
        12,
        -51
    );

    ctx.stroke();


    ctx.restore();
}


/* =========================================================
   WHEEL
========================================================= */

function drawWheel(x,y){

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        bike.wheelSpin
    );


    ctx.strokeStyle=
        "#111";

    ctx.lineWidth=6;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        12,
        0,
        Math.PI*2
    );

    ctx.stroke();


    ctx.lineWidth=2;

    for(
        let i=0;
        i<8;
        i++
    ){

        const a =
            i*Math.PI/4;

        ctx.beginPath();

        ctx.moveTo(
            0,
            0
        );

        ctx.lineTo(
            Math.cos(a)*10,
            Math.sin(a)*10
        );

        ctx.stroke();
    }

    ctx.restore();
}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    document.getElementById(
        "score"
    ).textContent =
        Math.floor(score);

    document.getElementById(
        "bonez"
    ).textContent =
        bonez+" / 5";

    document.getElementById(
        "distance"
    ).textContent =
        Math.floor(distance);
}


/* =========================================================
   START
========================================================= */

function startGame(){

    running=true;

    score=0;

    bonez=0;

    distance=0;

    cameraX=0;

    ramps=[];

    particles=[];

    bike.x=150;

    bike.y=
        groundY-
        bike.height/2;

    bike.vx=4;

    bike.vy=0;

    bike.angle=0;

    bike.angularVelocity=0;

    bike.onGround=true;

    bike.airborne=false;

    bike.airTime=0;

    bike.trickRotation=0;

    bike.wheelSpin=0;

    previousJump=false;

    generateRamps();

    updateHUD();

    document.getElementById(
        "overlay"
    ).style.display="none";

    document.querySelector(
        "#overlay h1"
    ).textContent=
        "BROKEN BONEZ";

    lastTime=
        performance.now();

    requestAnimationFrame(
        loop
    );
}


/* =========================================================
   LOOP
========================================================= */

function loop(time){

    if(!running)
        return;

    let dt =
        (time-lastTime)/1000;

    lastTime=time;

    dt=
        Math.min(
            dt,
            .033
        );


    update(dt);

    drawBackground();

    drawRamps();

    drawParticles();

    drawBike();

    updateHUD();


    requestAnimationFrame(
        loop
    );
}


/* =========================================================
   START BUTTON
========================================================= */

document.getElementById(
    "startBtn"
).addEventListener(
    "click",
    startGame
);


/*
    Mobile Safari touch fallback
*/

document.getElementById(
    "startBtn"
).addEventListener(
    "touchend",
    e=>{

        e.preventDefault();

        startGame();
    }
);

</script>
