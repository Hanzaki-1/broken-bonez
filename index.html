<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Broken Bonez Mobile</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,Helvetica,sans-serif;
    touch-action:none;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    max-width:1100px;
    overflow:hidden;
    background:#8ed6ff;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

/* ================= HUD ================= */

#hud{
    position:absolute;
    top:12px;
    left:12px;
    right:12px;

    display:flex;
    justify-content:space-between;
    align-items:flex-start;

    color:white;
    font-weight:900;
    text-shadow:
        2px 2px 0 #000,
        -1px -1px 0 #000;

    pointer-events:none;
    z-index:10;
}

.hudBox{
    background:rgba(0,0,0,.45);
    border:2px solid rgba(255,255,255,.4);
    border-radius:12px;
    padding:8px 12px;
    min-width:105px;
}

.hudLabel{
    font-size:11px;
    opacity:.8;
}

.hudValue{
    font-size:20px;
}

/* ================= CENTER MESSAGE ================= */

#message{
    position:absolute;
    left:50%;
    top:22%;
    transform:translateX(-50%);

    color:white;
    font-size:25px;
    font-weight:900;
    text-align:center;

    text-shadow:
        3px 3px 0 #000,
        -2px -2px 0 #000;

    pointer-events:none;
    opacity:0;

    z-index:20;
}

/* ================= OVERLAY ================= */

#overlay{
    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:rgba(0,0,0,.58);

    color:white;
    text-align:center;

    z-index:30;
}

#overlay h1{
    margin:0;
    font-size:clamp(38px,10vw,75px);
    font-weight:1000;
    letter-spacing:3px;

    text-shadow:
        5px 5px 0 #000;
}

#overlay p{
    margin:10px 20px 25px;
    font-size:16px;
    opacity:.9;
}

#startBtn{
    border:none;
    border-radius:16px;

    padding:16px 42px;

    background:#ffcc00;
    color:#111;

    font-size:22px;
    font-weight:1000;

    box-shadow:
        0 6px 0 #a87900,
        0 10px 20px rgba(0,0,0,.35);

    cursor:pointer;
    touch-action:manipulation;
}

#startBtn:active{
    transform:translateY(5px);
    box-shadow:
        0 2px 0 #a87900,
        0 5px 10px rgba(0,0,0,.35);
}

/* ================= CONTROLS ================= */

#controls{
    position:absolute;
    left:0;
    right:0;
    bottom:15px;

    display:flex;
    justify-content:space-between;
    align-items:flex-end;

    padding:0 14px;

    z-index:15;
}

.controlGroup{
    display:flex;
    gap:10px;
}

.control{
    width:72px;
    height:72px;

    border-radius:18px;
    border:3px solid rgba(255,255,255,.65);

    background:rgba(0,0,0,.48);

    color:white;
    font-size:24px;
    font-weight:1000;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 5px 0 rgba(0,0,0,.4);

    touch-action:none;
}

.control.big{
    width:88px;
}

.control:active,
.control.active{
    transform:translateY(5px);
    background:rgba(255,255,255,.25);
    box-shadow:
        0 1px 0 rgba(0,0,0,.4);
}

.smallText{
    font-size:12px;
    display:block;
}

/* ================= RESPONSIVE ================= */

@media(max-height:600px){

    .control{
        width:60px;
        height:60px;
        border-radius:15px;
        font-size:20px;
    }

    .control.big{
        width:75px;
    }

    #controls{
        bottom:8px;
    }

    #hud{
        top:7px;
    }
}

@media(min-width:700px){

    .control{
        width:82px;
        height:82px;
    }

    .control.big{
        width:100px;
    }
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="hud">

    <div class="hudBox">
        <div class="hudLabel">SCORE</div>
        <div class="hudValue" id="score">0</div>
    </div>

    <div class="hudBox">
        <div class="hudLabel">BONEZ</div>
        <div class="hudValue" id="bonez">0 / 5</div>
    </div>

    <div class="hudBox">
        <div class="hudLabel">DISTANCE</div>
        <div class="hudValue" id="distance">0</div>
    </div>

</div>

<div id="message"></div>

<div id="overlay">

    <h1>BROKEN BONEZ</h1>

    <p>
        Hit the ramps.<br>
        Spin in the air.<br>
        LAND ON YOUR WHEELS.
    </p>

    <button id="startBtn">START GAME</button>

</div>

<div id="controls">

    <div class="controlGroup">

        <button class="control"
                id="leftBtn">
            ◀
        </button>

        <button class="control"
                id="rightBtn">
            ▶
        </button>

    </div>

    <div class="controlGroup">

        <button class="control big"
                id="jumpBtn">
            ↑
        </button>

        <button class="control big"
                id="trickBtn">
            ↻
        </button>

    </div>

</div>

</div>

<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let groundY = 0;

function resize(){

    W = canvas.width = window.innerWidth * devicePixelRatio;
    H = canvas.height = window.innerHeight * devicePixelRatio;

    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );

    W = window.innerWidth;
    H = window.innerHeight;

    groundY = H * 0.76;
}

window.addEventListener("resize",resize);
resize();


/* =========================================================
   GAME VARIABLES
========================================================= */

let running = false;
let gameOver = false;

let score = 0;
let bonez = 0;
let distance = 0;
let tricks = 0;

let cameraX = 0;

let lastTime = 0;

let particles = [];

let ramps = [];


/* =========================================================
   PLAYER
========================================================= */

const bike = {

    x:150,

    y:0,

    vx:4,

    vy:0,

    width:76,
    height:38,

    angle:0,

    angularVelocity:0,

    onGround:true,

    airborne:false,

    jumping:false,

    trickRotation:0,

    trickStart:0,

    airTime:0,

    wheelSpin:0

};


/* =========================================================
   CONTROLS
========================================================= */

const keys = {

    left:false,
    right:false,
    jump:false,
    trick:false

};

function bindButton(id,key){

    const btn = document.getElementById(id);

    function down(e){

        e.preventDefault();

        keys[key] = true;

        btn.classList.add("active");
    }

    function up(e){

        e.preventDefault();

        keys[key] = false;

        btn.classList.remove("active");
    }

    btn.addEventListener("pointerdown",down);
    btn.addEventListener("pointerup",up);
    btn.addEventListener("pointercancel",up);
    btn.addEventListener("pointerleave",up);
}

bindButton("leftBtn","left");
bindButton("rightBtn","right");
bindButton("jumpBtn","jump");
bindButton("trickBtn","trick");


/* =========================================================
   KEYBOARD SUPPORT
========================================================= */

window.addEventListener("keydown",e=>{

    if(e.code==="ArrowLeft") keys.left=true;
    if(e.code==="ArrowRight") keys.right=true;
    if(e.code==="ArrowUp" || e.code==="Space") keys.jump=true;
    if(e.code==="KeyX" || e.code==="KeyZ") keys.trick=true;

});

window.addEventListener("keyup",e=>{

    if(e.code==="ArrowLeft") keys.left=false;
    if(e.code==="ArrowRight") keys.right=false;
    if(e.code==="ArrowUp" || e.code==="Space") keys.jump=false;
    if(e.code==="KeyX" || e.code==="KeyZ") keys.trick=false;

});


/* =========================================================
   RANDOM RAMP SYSTEM
========================================================= */

/*
    IMPORTANT:

    Ramps are NOT placed completely randomly.

    We keep them inside a controlled range:

    Minimum gap = 220
    Maximum gap = 360

    This prevents impossible jumps.
*/

function randomRampGap(){

    const minGap = 220;
    const maxGap = 360;

    return minGap + Math.random() * (maxGap-minGap);
}


/*
    Create a ramp.
*/

function createRamp(x){

    const width =
        105 + Math.random()*35;

    const height =
        35 + Math.random()*20;

    ramps.push({

        x:x,

        width:width,

        height:height,

        angle:-0.22

    });

}


/*
    Generate enough ramps ahead.
*/

function generateRamps(){

    while(
        ramps.length < 10 ||
        ramps[ramps.length-1].x <
        cameraX + W + 500
    ){

        let nextX;

        if(ramps.length===0){

            nextX = 450;

        }else{

            const last =
                ramps[ramps.length-1];

            /*
                RANDOM BUT CONTROLLED DISTANCE
            */

            nextX =
                last.x +
                last.width +
                randomRampGap();
        }

        createRamp(nextX);
    }
}


/*
    Remove ramps far behind camera.
*/

function cleanupRamps(){

    ramps =
        ramps.filter(r =>
            r.x + r.width >
            cameraX - 500
        );
}


/* =========================================================
   PARTICLES
========================================================= */

function particle(x,y,count=10){

    for(let i=0;i<count;i++){

        particles.push({

            x:x,
            y:y,

            vx:(Math.random()-.5)*6,
            vy:-Math.random()*5,

            life:1,

            size:2+Math.random()*4
        });
    }
}


function updateParticles(dt){

    for(const p of particles){

        p.x += p.vx * dt * 60;

        p.y += p.vy * dt * 60;

        p.vy += .25 * dt * 60;

        p.life -= .025 * dt * 60;
    }

    particles =
        particles.filter(p=>p.life>0);
}


function drawParticles(){

    for(const p of particles){

        ctx.globalAlpha=p.life;

        ctx.fillStyle="#ffffff";

        ctx.fillRect(
            p.x-cameraX,
            p.y,
            p.size,
            p.size
        );
    }

    ctx.globalAlpha=1;
}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    running=true;
    gameOver=false;

    score=0;
    bonez=0;
    distance=0;
    tricks=0;

    cameraX=0;

    particles=[];

    ramps=[];

    bike.x=150;
    bike.vx=4;
    bike.vy=0;
    bike.angle=0;
    bike.angularVelocity=0;

    bike.onGround=true;
    bike.airborne=false;

    bike.trickRotation=0;
    bike.trickStart=0;
    bike.airTime=0;

    bike.y=groundY-35;

    generateRamps();

    document.getElementById("overlay").style.display="none";

    lastTime=performance.now();

    requestAnimationFrame(loop);
}


/* =========================================================
   GAME OVER
========================================================= */

function endGame(){

    running=false;
    gameOver=true;

    document.getElementById("overlay").style.display="flex";

    document.querySelector("#overlay h1").textContent =
        "BROKEN BONEZ";

    document.querySelector("#overlay p").innerHTML =
        `
        FINAL SCORE: <b>${Math.floor(score)}</b><br>
        DISTANCE: <b>${Math.floor(distance)}</b><br><br>
        ${bonez >= 5 ? "5 BROKEN BONEZ!" : "CRASHED!"}
        `;

    document.getElementById("startBtn").textContent =
        "PLAY AGAIN";
}


/* =========================================================
   JUMP
========================================================= */

let previousJump=false;

function handleJump(){

    if(
        keys.jump &&
        !previousJump &&
        bike.onGround
    ){

        bike.vy=-11;

        bike.onGround=false;
        bike.airborne=true;

        bike.airTime=0;

        bike.trickRotation=0;

        particle(
            bike.x,
            bike.y+bike.height,
            8
        );
    }

    previousJump=keys.jump;
}


/* =========================================================
   UPDATE PLAYER
========================================================= */

function updateBike(dt){

    handleJump();

    /*
        Constant forward movement.
    */

    bike.vx += .015 * dt * 60;

    bike.vx =
        Math.min(bike.vx,7.5);


    /*
        Gentle leaning.
    */

    if(bike.airborne){

        if(keys.left){

            bike.angularVelocity -=
                .00035 * dt * 60;
        }

        if(keys.right){

            bike.angularVelocity +=
                .00035 * dt * 60;
        }

        /*
            Keep lean gentle.
        */

        bike.angularVelocity =
            Math.max(
                -.0025,
                Math.min(
                    .0025,
                    bike.angularVelocity
                )
            );
    }

    bike.angle +=
        bike.angularVelocity *
        dt *
        60;


    /*
        Trick rotation.

        Hold TRICK and the bike spins.

        360 degrees
        720 degrees
        1080 degrees
        etc.
    */

    if(
        bike.airborne &&
        keys.trick
    ){

        const spinSpeed =
            0.12 * dt * 60;

        bike.trickRotation += spinSpeed;

        bike.angle += spinSpeed;

    }


    /*
        Gravity.
    */

    bike.vy += .45 * dt * 60;

    bike.y += bike.vy * dt * 60;

    bike.x += bike.vx * dt * 60;


    /*
        Air time.
    */

    if(bike.airborne){

        bike.airTime += dt;
    }


    /*
        Ground / ramp collision.
    */

    checkLanding();


    /*
        Camera follows bike.
    */

    const targetCamera =
        bike.x - W * .30;

    cameraX +=
        (targetCamera-cameraX) *
        .08;


    /*
        Distance.
    */

    distance =
        Math.max(
            distance,
            (bike.x-150)/10
        );


    /*
        Wheel animation.
    */

    bike.wheelSpin +=
        bike.vx * dt * 0.8;
}


/* =========================================================
   FIND GROUND / RAMP
========================================================= */

function getRampSurface(x){

    for(const r of ramps){

        if(
            x >= r.x &&
            x <= r.x+r.width
        ){

            const progress =
                (x-r.x)/r.width;

            /*
                Ramp rises toward the end.
            */

            const surfaceY =
                groundY -
                Math.sin(
                    progress*Math.PI/2
                ) *
                r.height;

            return {

                y:surfaceY,
                ramp:r
            };
        }
    }

    return null;
}


/* =========================================================
   LANDING
========================================================= */

function checkLanding(){

    const rearWheelX =
        bike.x-28;

    const frontWheelX =
        bike.x+28;

    const rear =
        getRampSurface(rearWheelX);

    const front =
        getRampSurface(frontWheelX);


    /*
        If there is a ramp under the bike,
        calculate approximate landing height.
    */

    let surface=null;

    if(rear) surface=rear;
    if(front) surface=front;


    /*
        Normal ground.
    */

    if(!surface){

        if(
            bike.y+bike.height >= groundY &&
            bike.vy >= 0
        ){

            landOnSurface(
                groundY,
                null
            );
        }

        return;
    }


    /*
        Ramp collision.
    */

    const wheelBottom =
        bike.y+bike.height/2;

    if(
        wheelBottom >= surface.y &&
        bike.vy >= 0
    ){

        landOnSurface(
            surface.y,
            surface.ramp
        );
    }
}


/* =========================================================
   LAND ON SURFACE
========================================================= */

function landOnSurface(surfaceY,ramp){

    const completedRotation =
        Math.abs(
            bike.trickRotation
        );

    const rotations =
        Math.floor(
            completedRotation /
            (Math.PI*2)
        );


    /*
        SAFE LANDING TEST

        Bike should be reasonably upright.

        If it is upside down or sideways,
        BREAK BONEZ.
    */

    const normalized =
        Math.atan2(
            Math.sin(bike.angle),
            Math.cos(bike.angle)
        );

    const safe =
        Math.abs(normalized) < 0.65;


    if(!safe){

        crash();

        return;
    }


    /*
        Successful landing.
    */

    bike.y =
        surfaceY -
        bike.height/2;

    bike.vy=0;

    bike.onGround=true;
    bike.airborne=false;

    bike.angularVelocity *= .2;


    /*
        Trick scoring.

        360 = 500
        Larger rotations increase score.
    */

    if(rotations>0){

        tricks += rotations;

        let trickScore=0;

        if(rotations===1){

            trickScore=500;

        }else if(rotations===2){

            trickScore=1000;

        }else if(rotations===3){

            trickScore=2000;

        }else{

            trickScore=
                2000 +
                (rotations-3)*1000;
        }

        score += trickScore;

        showMessage(
            rotations +
            "× SPIN  +" +
            trickScore
        );

    }else{

        /*
            Normal landing.
        */

        score += 10;

        showMessage(
            "LANDING +10"
        );
    }


    particle(
        bike.x,
        surfaceY,
        10
    );


    bike.trickRotation=0;
}


/* =========================================================
   CRASH
========================================================= */

function crash(){

    bonez++;

    score -= 100;

    bike.onGround=false;
    bike.airborne=true;

    bike.vy=-5;

    bike.angularVelocity =
        (Math.random()>.5 ? 1 : -1)
        * .025;


    particle(
        bike.x,
        bike.y,
        20
    );


    showMessage(
        "BROKEN BONEZ!"
    );


    document.getElementById("bonez")
        .textContent =
        bonez+" / 5";


    if(bonez>=5){

        setTimeout(
            endGame,
            700
        );
    }
}


/* =========================================================
   MESSAGE
========================================================= */

let messageTimer=null;

function showMessage(text){

    const el =
        document.getElementById("message");

    el.textContent=text;

    el.style.opacity=1;

    clearTimeout(messageTimer);

    messageTimer =
        setTimeout(()=>{

            el.style.opacity=0;

        },700);
}


/* =========================================================
   DRAW BACKGROUND
========================================================= */

function drawBackground(){

    /*
        Sky.
    */

    const gradient =
        ctx.createLinearGradient(
            0,0,
            0,H
        );

    gradient.addColorStop(
        0,
        "#62c8ff"
    );

    gradient.addColorStop(
        1,
        "#d9f4ff"
    );

    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
        Clouds.
    */

    ctx.fillStyle="rgba(255,255,255,.7)";

    for(let i=0;i<8;i++){

        const x =
            ((i*300-cameraX*.15)
            % (W+400))-100;

        const y =
            80+(i%3)*55;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            30,
            0,
            Math.PI*2
        );

        ctx.arc(
            x+35,
            y-12,
            38,
            0,
            Math.PI*2
        );

        ctx.arc(
            x+75,
            y,
            28,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    /*
        Background hills.
    */

    ctx.fillStyle="#77b85a";

    ctx.beginPath();

    ctx.moveTo(0,groundY);

    for(
        let x=0;
        x<=W+100;
        x+=50
    ){

        const y =
            groundY-
            80-
            Math.sin(
                (x+cameraX*.2)*.01
            )*35;

        ctx.lineTo(x,y);
    }

    ctx.lineTo(W,H);

    ctx.lineTo(0,H);

    ctx.closePath();

    ctx.fill();


    /*
        Ground.
    */

    ctx.fillStyle="#4d3525";

    ctx.fillRect(
        0,
        groundY,
        W,
        H-groundY
    );


    /*
        Dirt stripes.
    */

    ctx.fillStyle="#684a32";

    for(
        let x=-100;
        x<W+100;
        x+=90
    ){

        const sx =
            x -
            (cameraX*.5)%90;

        ctx.fillRect(
            sx,
            groundY+25,
            45,
            5
        );
    }
}


/* =========================================================
   DRAW RAMPS
========================================================= */

function drawRamps(){

    for(const r of ramps){

        const x =
            r.x-cameraX;

        if(
            x+r.width < -50 ||
            x > W+50
        ) continue;


        /*
            Ramp shape.
        */

        ctx.fillStyle="#8b5a35";

        ctx.beginPath();

        ctx.moveTo(
            x,
            groundY
        );

        ctx.lineTo(
            x+r.width,
            groundY
        );

        ctx.lineTo(
            x+r.width,
            groundY-r.height
        );

        ctx.closePath();

        ctx.fill();


        /*
            Ramp top.
        */

        ctx.strokeStyle="#3d2718";

        ctx.lineWidth=6;

        ctx.beginPath();

        ctx.moveTo(
            x,
            groundY
        );

        ctx.lineTo(
            x+r.width,
            groundY-r.height
        );

        ctx.stroke();


        /*
            Ramp markings.
        */

        ctx.strokeStyle="#c4874d";

        ctx.lineWidth=3;

        for(
            let i=15;
            i<r.width;
            i+=25
        ){

            const progress =
                i/r.width;

            const y =
                groundY -
                Math.sin(
                    progress*Math.PI/2
                ) *
                r.height;

            ctx.beginPath();

            ctx.moveTo(
                x+i,
                y
            );

            ctx.lineTo(
                x+i-8,
                y+12
            );

            ctx.stroke();
        }
    }
}


/* =========================================================
   DRAW BIKE
========================================================= */

function drawBike(){

    const x =
        bike.x-cameraX;

    const y =
        bike.y;

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        bike.angle
    );


    /*
        Wheels.
    */

    drawWheel(
        -28,
        19
    );

    drawWheel(
        28,
        19
    );


    /*
        Frame.
    */

    ctx.strokeStyle="#111";

    ctx.lineWidth=6;

    ctx.beginPath();

    ctx.moveTo(-28,10);

    ctx.lineTo(-5,-10);

    ctx.lineTo(28,10);

    ctx.lineTo(-28,10);

    ctx.moveTo(-5,-10);

    ctx.lineTo(12,10);

    ctx.stroke();


    /*
        Seat.
    */

    ctx.fillStyle="#111";

    ctx.fillRect(
        -10,
        -16,
        20,
        5
    );


    /*
        Handlebar.
    */

    ctx.strokeStyle="#111";

    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.moveTo(
        28,
        10
    );

    ctx.lineTo(
        34,
        -8
    );

    ctx.lineTo(
        43,
        -8
    );

    ctx.stroke();


    /*
        Rider body.
    */

    ctx.fillStyle="#e84b32";

    ctx.fillRect(
        -5,
        -31,
        17,
        20
    );


    /*
        Rider head.
    */

    ctx.fillStyle="#f2c29b";

    ctx.beginPath();

    ctx.arc(
        4,
        -39,
        9,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        Helmet.
    */

    ctx.fillStyle="#222";

    ctx.beginPath();

    ctx.arc(
        4,
        -42,
        10,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();
}


function drawWheel(x,y){

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(
        bike.wheelSpin
    );

    ctx.strokeStyle="#111";

    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        11,
        0,
        Math.PI*2
    );

    ctx.stroke();


    ctx.lineWidth=2;

    for(let i=0;i<6;i++){

        const a =
            i*Math.PI/3;

        ctx.beginPath();

        ctx.moveTo(
            0,
            0
        );

        ctx.lineTo(
            Math.cos(a)*10,
            Math.sin(a)*10
        );

        ctx.stroke();
    }

    ctx.restore();
}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    document.getElementById("score")
        .textContent =
        Math.floor(score);

    document.getElementById("bonez")
        .textContent =
        bonez+" / 5";

    document.getElementById("distance")
        .textContent =
        Math.floor(distance);
}


/* =========================================================
   MAIN LOOP
========================================================= */

function loop(time){

    if(!running) return;

    let dt =
        (time-lastTime)/1000;

    lastTime=time;

    /*
        Prevent huge physics jumps
        if browser pauses.
    */

    dt =
        Math.min(dt,.033);


    updateBike(dt);

    updateParticles(dt);

    generateRamps();

    cleanupRamps();


    /*
        DRAW
    */

    drawBackground();

    drawRamps();

    drawParticles();

    drawBike();

    updateHUD();


    requestAnimationFrame(loop);
}


/* =========================================================
   START BUTTON
========================================================= */

document
    .getElementById("startBtn")
    .addEventListener(
        "click",
        startGame
    );


/*
    Also allow tapping overlay itself
    if necessary on mobile.
*/

document
    .getElementById("overlay")
    .addEventListener(
        "touchend",
        e=>{

            if(
                e.target.id === "overlay"
            ){
                startGame();
            }

        }
    );

</script>
