<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broken Bonez</title>
<style>
  body {
    margin: 0;
    background: black;
    color: yellow;
    font-family: 'Press Start 2P', monospace;
    text-align: center;
    overflow: hidden;
  }
  #gameCanvas {
    background: skyblue;
    display: block;
    margin: 0 auto;
    touch-action: none;
  }
  #hud {
    position: absolute;
    top: 10px;
    left: 10px;
    color: white;
    font-size: 12px;
    text-align: left;
  }
  #bones {
    margin-top: 5px;
  }
  .bone {
    display: inline-block;
    width: 20px;
    height: 5px;
    background: white;
    border-radius: 3px;
    margin-right: 3px;
  }
  #trickBtn {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: red;
    color: white;
    border: none;
    padding: 15px 25px;
    font-size: 1em;
    border-radius: 10px;
  }
</style>
</head>
<body>
<div id="hud">
  <div>PLAYER 1 SCORE: <span id="score">0</span></div>
  <div id="bones"></div>
</div>

<canvas id="gameCanvas" width="400" height="300"></canvas>
<button id="trickBtn" ontouchstart="doTrick()">TRICK</button>
<audio id="bgMusic" src="song.mp3" loop></audio>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let player = {x: 200, y: 250, vy: 0, angle: 0, spinning: false};
let score = 0;
let health = 5;
let ramps = [];
let scrollSpeed = 2;
let gameRunning = true;

function drawBones() {
  const bonesDiv = document.getElementById('bones');
  bonesDiv.innerHTML = '';
  for (let i = 0; i < health; i++) {
    const bone = document.createElement('div');
    bone.className = 'bone';
    bonesDiv.appendChild(bone);
  }
}

function createRamp() {
  const length = Math.random() * 80 + 40;
  const height = Math.random() * 30 + 10;
  const x = canvas.width + Math.random() * 200;
  ramps.push({x, length, height});
}

function updateRamps() {
  for (let r of ramps) r.x -= scrollSpeed;
  ramps = ramps.filter(r => r.x + r.length > 0);
  if (ramps.length < 5) createRamp();
}

function drawRamps() {
  ctx.fillStyle = 'brown';
  for (let r of ramps) {
    ctx.beginPath();
    ctx.moveTo(r.x, 280);
    ctx.lineTo(r.x + r.length, 280 - r.height);
    ctx.lineTo(r.x + r.length, 280);
    ctx.closePath();
    ctx.fill();
  }
}

function doTrick() {
  if (!player.spinning) {
    player.spinning = true;
    let spinAngle = 0;
    const spinInterval = setInterval(() => {
      spinAngle += 30;
      player.angle = spinAngle;
      if (spinAngle >= 360) {
        clearInterval(spinInterval);
        player.spinning = false;
        player.angle = 0;
        score += 100;
        document.getElementById('score').textContent = score;
      }
    }, 50);
  }
}

function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = 'gray';
  ctx.fillRect(0, 280, 400, 20);

  updateRamps();
  drawRamps();

  player.vy += 0.5;
  player.y += player.vy;
  if (player.y > 250) {
    player.y = 250;
    player.vy = 0;
  }

  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate((player.angle * Math.PI) / 180);
  ctx.fillStyle = 'red';
  ctx.fillRect(-10, -20, 20, 20);
  ctx.fillStyle = 'gray';
  ctx.fillRect(-20, 0, 40, 10);
  ctx.restore();

  drawBones();
  requestAnimationFrame(gameLoop);
}

document.getElementById('bgMusic').play();
drawBones();
gameLoop();
</script>
</body>
</html>
