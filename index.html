<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>Broken Bonez - Pixel Moto</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:monospace;
    touch-action:none;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

/* =========================================================
   GAME SCREEN
========================================================= */

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#000;
}

canvas{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
}

/* =========================================================
   START / GAME OVER SCREEN
========================================================= */

#menu{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#050505;
    z-index:20;
    color:white;
    text-align:center;
}

#menuTitle{
    font-size:clamp(30px,10vw,64px);
    font-weight:900;
    letter-spacing:2px;
    color:#f7f0d0;
    text-shadow:
        4px 4px 0 #8b1717,
        8px 8px 0 #000;
    margin-bottom:8px;
}

#menuSub{
    color:#e43b30;
    font-size:clamp(12px,4vw,22px);
    font-weight:bold;
    margin-bottom:25px;
}

#menuMessage{
    color:#fff;
    font-size:12px;
    min-height:18px;
    margin-bottom:18px;
}

#startBtn{
    appearance:none;
    border:none;
    border-radius:0;

    background:#d52c27;
    color:#fff;

    font-family:monospace;
    font-size:18px;
    font-weight:bold;

    padding:15px 32px;

    border-top:4px solid #ff7460;
    border-left:4px solid #ff7460;
    border-right:4px solid #64100d;
    border-bottom:4px solid #64100d;

    box-shadow:6px 6px 0 #000;

    cursor:pointer;
    touch-action:manipulation;
}

#startBtn:active{
    transform:translate(3px,3px);
    box-shadow:3px 3px 0 #000;
}

#instructions{
    margin-top:25px;
    font-size:10px;
    line-height:1.7;
    color:#aaa;
}

/* =========================================================
   MOBILE CONTROLS
========================================================= */

#controls{
    position:absolute;
    left:0;
    right:0;
    bottom:
        max(10px, env(safe-area-inset-bottom));
    height:105px;

    display:flex;
    justify-content:space-between;
    align-items:flex-end;

    padding:
        0
        max(12px, env(safe-area-inset-right))
        0
        max(12px, env(safe-area-inset-left));

    z-index:15;

    pointer-events:none;
}

.controlGroup{
    display:flex;
    gap:8px;
    pointer-events:auto;
}

.gameButton{
    width:64px;
    height:64px;

    border-radius:0;
    border:3px solid #111;

    background:#ded2a4;

    color:#111;
    font-family:monospace;
    font-size:20px;
    font-weight:bold;

    box-shadow:
        4px 4px 0 #000,
        inset 3px 3px 0 #fff,
        inset -3px -3px 0 #777;

    user-select:none;
    -webkit-user-select:none;

    touch-action:none;
}

.gameButton:active,
.gameButton.active{
    transform:translate(3px,3px);
    box-shadow:
        1px 1px 0 #000,
        inset -2px -2px 0 #777;
}

#leftBtn,
#rightBtn{
    font-size:25px;
}

#jumpBtn{
    background:#d5c06b;
}

#trickBtn{
    background:#d83a32;
    color:white;
    border-color:#111;
}

/* =========================================================
   RESPONSIVE BUTTONS
========================================================= */

@media(max-height:600px){

    #controls{
        height:80px;
    }

    .gameButton{
        width:54px;
        height:54px;
    }

    #instructions{
        margin-top:12px;
    }

}

@media(min-width:700px){

    #controls{
        max-width:700px;
        margin:auto;
    }

}
</style>
</head>

<body>

<div id="game">

    <canvas id="canvas"
            width="320"
            height="180">
    </canvas>

    <!-- MENU -->
    <div id="menu">

        <div id="menuTitle">
            BROKEN BONEZ
        </div>

        <div id="menuSub">
            PIXEL MOTOCROSS
        </div>

        <div id="menuMessage">
            GO CRAZY IN THE AIR
        </div>

        <button id="startBtn">
            START GAME
        </button>

        <div id="instructions">
            JUMP OVER RAMPS<br>
            LEAN TO LAND<br>
            TRICK FOR BIG POINTS<br>
            5 BROKEN BONEZ = GAME OVER
        </div>

    </div>

    <!-- MOBILE CONTROLS -->
    <div id="controls">

        <div class="controlGroup">
            <button class="gameButton"
                    id="leftBtn">
                ◀
            </button>

            <button class="gameButton"
                    id="rightBtn">
                ▶
            </button>
        </div>

        <div class="controlGroup">

            <button class="gameButton"
                    id="jumpBtn">
                ▲
            </button>

            <button class="gameButton"
                    id="trickBtn">
                ★
            </button>

        </div>

    </div>

</div>

<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;

const W = 320;
const H = 180;

/* =========================================================
   GAME STATE
========================================================= */

let running = false;
let gameOver = false;

let score = 0;
let bonez = 0;
let distance = 0;

let cameraX = 0;

let lastTime = 0;

let ramps = [];
let particles = [];

/* =========================================================
   BIKE
========================================================= */

const bike = {

    x:60,

    y:122,

    vx:2.7,

    vy:0,

    angle:0,

    angularVelocity:0,

    onGround:true,

    airborne:false,

    trick:false,

    trickRotation:0,

    wheelRotation:0,

    crashTimer:0

};

/* =========================================================
   CONSTANTS
========================================================= */

const GROUND = 128;

const GRAVITY = 0.30;

const MAX_LEAN = 0.65;

const RAMP_MIN_GAP = 220;
const RAMP_MAX_GAP = 360;

/* =========================================================
   INPUT
========================================================= */

const input = {

    left:false,
    right:false,
    jump:false,
    trick:false

};

/* =========================================================
   BUTTON HANDLING
========================================================= */

function setupHoldButton(id,key){

    const button = document.getElementById(id);

    const down = e => {

        e.preventDefault();

        input[key] = true;

        button.classList.add("active");

    };

    const up = e => {

        e.preventDefault();

        input[key] = false;

        button.classList.remove("active");

    };

    button.addEventListener("pointerdown",down);
    button.addEventListener("pointerup",up);
    button.addEventListener("pointercancel",up);
    button.addEventListener("pointerleave",up);

}

setupHoldButton("leftBtn","left");
setupHoldButton("rightBtn","right");
setupHoldButton("jumpBtn","jump");
setupHoldButton("trickBtn","trick");

/* =========================================================
   KEYBOARD SUPPORT
========================================================= */

window.addEventListener("keydown",e => {

    if(e.key==="ArrowLeft") input.left=true;
    if(e.key==="ArrowRight") input.right=true;
    if(e.key==="ArrowUp" || e.key===" ") input.jump=true;

    if(e.key==="x" || e.key==="X") input.trick=true;

});

window.addEventListener("keyup",e => {

    if(e.key==="ArrowLeft") input.left=false;
    if(e.key==="ArrowRight") input.right=false;
    if(e.key==="ArrowUp" || e.key===" ") input.jump=false;

    if(e.key==="x" || e.key==="X") input.trick=false;

});

/* =========================================================
   START BUTTON
========================================================= */

const menu = document.getElementById("menu");
const startBtn = document.getElementById("startBtn");
const menuTitle = document.getElementById("menuTitle");
const menuSub = document.getElementById("menuSub");
const menuMessage = document.getElementById("menuMessage");

startBtn.addEventListener("pointerdown",e => {

    e.preventDefault();

    startGame();

});

/* =========================================================
   START GAME
========================================================= */

function startGame(){

    running = true;
    gameOver = false;

    score = 0;
    bonez = 0;
    distance = 0;

    cameraX = 0;

    bike.x = 60;
    bike.y = GROUND;
    bike.vx = 2.7;
    bike.vy = 0;

    bike.angle = 0;
    bike.angularVelocity = 0;

    bike.onGround = true;
    bike.airborne = false;

    bike.trick = false;
    bike.trickRotation = 0;

    bike.crashTimer = 0;

    ramps = [];
    particles = [];

    generateInitialRamps();

    menu.style.display = "none";

}

/* =========================================================
   GAME OVER
========================================================= */

function showGameOver(){

    running = false;
    gameOver = true;

    menu.style.display = "flex";

    menuTitle.textContent = "GAME OVER";

    menuSub.textContent =
        "BROKEN BONEZ × " + bonez;

    menuMessage.textContent =
        "SCORE " + Math.max(0,Math.floor(score));

    startBtn.textContent = "PLAY AGAIN";

}

/* =========================================================
   RAMPS
========================================================= */

function generateInitialRamps(){

    let x = 350;

    for(let i=0;i<12;i++){

        addRamp(x);

        x += random(
            RAMP_MIN_GAP,
            RAMP_MAX_GAP
        );

    }

}

/* =========================================================
   ADD RAMP
========================================================= */

function addRamp(x){

    const width = random(28,42);

    const height = random(12,22);

    ramps.push({

        x:x,
        width:width,
        height:height

    });

}

/* =========================================================
   KEEP RAMPS COMING
========================================================= */

function updateRamps(){

    let furthest = 0;

    for(const r of ramps){

        if(r.x > furthest){
            furthest = r.x;
        }

    }

    while(
        furthest <
        bike.x + 700
    ){

        furthest += random(
            RAMP_MIN_GAP,
            RAMP_MAX_GAP
        );

        addRamp(furthest);

    }

    ramps = ramps.filter(
        r => r.x > bike.x - 250
    );

}

/* =========================================================
   RANDOM
========================================================= */

function random(min,max){

    return Math.floor(
        Math.random()*(max-min+1)
    ) + min;

}

/* =========================================================
   CLAMP
========================================================= */

function clamp(v,min,max){

    return Math.max(
        min,
        Math.min(max,v)
    );

}

/* =========================================================
   GET TRACK SURFACE
========================================================= */

function getSurface(x){

    let surface = GROUND;

    for(const r of ramps){

        if(
            x >= r.x &&
            x <= r.x + r.width
        ){

            const t =
                (x-r.x)/r.width;

            const slope =
                t < 0.5
                ? t*2
                : (1-t)*2;

            surface =
                GROUND -
                slope*r.height;

        }

    }

    return surface;

}

/* =========================================================
   UPDATE GAME
========================================================= */

function update(dt){

    if(!running) return;

    const frame =
        Math.min(dt/16.67,2);

    /* SPEED */

    bike.vx += 0.002 * frame;

    bike.vx =
        clamp(
            bike.vx,
            2.5,
            5.2
        );

    /* DISTANCE */

    distance += bike.vx * frame;

    /* WHEEL */

    bike.wheelRotation +=
        bike.vx * 0.08 * frame;

    /* JUMP */

    if(
        input.jump &&
        bike.onGround
    ){

        bike.vy = -7.5;

        bike.onGround = false;
        bike.airborne = true;

        bike.trickRotation = 0;

        createDust(
            bike.x,
            bike.y+5,
            5
        );

    }

    /* AIRBORNE */

    if(bike.airborne){

        bike.vy +=
            GRAVITY * frame;

        bike.y +=
            bike.vy * frame;

        /* LEAN */

        if(input.left){

            bike.angularVelocity -=
                0.025 * frame;

        }

        if(input.right){

            bike.angularVelocity +=
                0.025 * frame;

        }

        bike.angularVelocity *=
            Math.pow(0.90,frame);

        bike.angularVelocity =
            clamp(
                bike.angularVelocity,
                -0.09,
                0.09
            );

        bike.angle +=
            bike.angularVelocity * frame;

        /* TRICK */

        if(input.trick){

            bike.trick = true;

            bike.trickRotation +=
                0.22 * frame;

            bike.angle +=
                0.22 * frame;

        }

        /* SURFACE */

        const surface =
            getSurface(
                bike.x + 8
            );

        if(
            bike.y >= surface
        ){

            landBike();

        }

    }

    /* GROUND */

    if(bike.onGround){

        bike.y =
            getSurface(
                bike.x + 8
            );

        bike.angle *=
            Math.pow(0.65,frame);

        bike.angularVelocity = 0;

    }

    /* MOVE */

    bike.x +=
        bike.vx * frame;

    /* CAMERA */

    cameraX =
        bike.x - 75;

    if(cameraX < 0)
        cameraX = 0;

    /* RAMPS */

    updateRamps();

    /* PARTICLES */

    updateParticles();

    /* CRASH */

    if(bike.crashTimer > 0){

        bike.crashTimer -=
            frame;

        if(
            bike.crashTimer <= 0
        ){

            bike.crashTimer = 0;

        }

    }

}

/* =========================================================
   LAND BIKE
========================================================= */

function landBike(){

    bike.airborne = false;
    bike.onGround = true;

    bike.y =
        getSurface(
            bike.x+8
        );

    const rotations =
        Math.floor(
            Math.abs(
                bike.trickRotation
            ) /
            (Math.PI*2)
        );

    const normalized =
        normalizeAngle(
            bike.angle
        );

    const safe =
        Math.abs(normalized)
        < 0.75;

    if(!safe){

        crash();

        return;

    }

    /* NORMAL LANDING */

    if(rotations <= 0){

        score += 10;

    }

    /* 360 */

    if(rotations === 1){

        score += 500;

    }

    /* 720 */

    if(rotations === 2){

        score += 1000;

    }

    /* 1080 */

    if(rotations === 3){

        score += 2000;

    }

    /* MORE THAN 1080 */

    if(rotations > 3){

        score +=
            2000 +
            ((rotations-3)*1000);

    }

    if(rotations > 0){

        createSparkBurst(
            bike.x,
            bike.y-10,
            Math.min(
                rotations,
                8
            )
        );

    }

    bike.angle =
        normalized;

    bike.angularVelocity = 0;

    bike.trick = false;
    bike.trickRotation = 0;

}

/* =========================================================
   NORMALIZE ANGLE
========================================================= */

function normalizeAngle(angle){

    while(
        angle > Math.PI
    ){
        angle -= Math.PI*2;
    }

    while(
        angle < -Math.PI
    ){
        angle += Math.PI*2;
    }

    return angle;

}

/* =========================================================
   CRASH
========================================================= */

function crash(){

    bonez++;

    score -= 100;

    if(score < 0)
        score = 0;

    bike.airborne = false;
    bike.onGround = true;

    bike.angle =
        bike.angle > 0
        ? 1.8
        : -1.8;

    bike.crashTimer = 35;

    createCrashParticles(
        bike.x,
        bike.y-5
    );

    bike.trickRotation = 0;
    bike.trick = false;

    if(bonez >= 5){

        setTimeout(
            showGameOver,
            500
        );

    }

}

/* =========================================================
   PARTICLES
========================================================= */

function createDust(x,y,count){

    for(let i=0;i<count;i++){

        particles.push({

            x:x-cameraX,
            y:y,

            vx:random(-2,2)/3,
            vy:random(-2,0)/3,

            life:random(10,22),

            type:"dust"

        });

    }

}

function createSparkBurst(x,y,amount){

    for(let i=0;i<amount*5;i++){

        particles.push({

            x:x-cameraX,
            y:y,

            vx:
                (Math.random()-0.5)*2.5,

            vy:
                (Math.random()-0.5)*2.5,

            life:random(10,25),

            type:"spark"

        });

    }

}

function createCrashParticles(x,y){

    for(let i=0;i<18;i++){

        particles.push({

            x:x-cameraX,

            y:y,

            vx:
                (Math.random()-0.5)*3,

            vy:
                (Math.random()-0.8)*3,

            life:random(15,35),

            type:"crash"

        });

    }

}

function updateParticles(){

    for(const p of particles){

        p.x += p.vx;
        p.y += p.vy;

        if(
            p.type === "crash" ||
            p.type === "spark"
        ){

            p.vy += 0.08;

        }

        p.life--;

    }

    particles =
        particles.filter(
            p => p.life > 0
        );

}

/* =========================================================
   DRAW
========================================================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    drawSky();

    drawCrowd();

    drawGrass();

    drawTrack();

    drawRamps();

    drawTrackDetails();

    drawParticles();

    drawBike();

    drawHUD();

}

/* =========================================================
   SKY
========================================================= */

function drawSky(){

    ctx.fillStyle="#62b6df";

    ctx.fillRect(
        0,
        0,
        W,
        105
    );

    /* clouds */

    ctx.fillStyle="#d9eee8";

    for(let i=0;i<5;i++){

        const x =
            ((i*95 -
              cameraX*0.15)
             % 380 + 380) % 380 - 30;

        const y =
            18 + (i%2)*10;

        ctx.fillRect(
            x,
            y,
            20,
            4
        );

        ctx.fillRect(
            x+5,
            y-3,
            10,
            7
        );

    }

    /* distant hills */

    ctx.fillStyle="#5b963d";

    for(let x=-40;x<W+80;x+=60){

        const px =
            x -
            (cameraX*0.18)%60;

        ctx.fillRect(
            px,
            77,
            60,
            28
        );

        ctx.fillStyle="#477b35";

        ctx.fillRect(
            px+12,
            72,
            30,
            5
        );

        ctx.fillStyle="#5b963d";

    }

}

/* =========================================================
   CROWD
========================================================= */

function drawCrowd(){

    /* grandstand */

    ctx.fillStyle="#66505c";

    ctx.fillRect(
        0,
        45,
        W,
        22
    );

    /* crowd pixels */

    for(let x=0;x<W;x+=6){

        const offset =
            Math.floor(
                cameraX/5
            ) % 6;

        const px =
            x - offset;

        ctx.fillStyle =
            x%12===0
            ? "#e7c6a3"
            : "#d34b42";

        ctx.fillRect(
            px,
            42,
            3,
            5
        );

        ctx.fillStyle="#222";

        ctx.fillRect(
            px+1,
            47,
            2,
            5
        );

    }

    /* banner */

    for(let x=0;x<W;x+=80){

        const bx =
            x -
            (cameraX*0.35)%80;

        ctx.fillStyle="#8e2830";

        ctx.fillRect(
            bx,
            56,
            65,
            8
        );

        ctx.fillStyle="#f3e5bc";

        ctx.font=
            "6px monospace";

        ctx.fillText(
            "BROKEN",
            bx+5,
            62
        );

    }

}

/* =========================================================
   GRASS
========================================================= */

function drawGrass(){

    ctx.fillStyle="#5cae3f";

    ctx.fillRect(
        0,
        90,
        W,
        17
    );

    ctx.fillRect(
        0,
        158,
        W,
        8
    );

    /* grass pixels */

    ctx.fillStyle="#377b32";

    for(let x=0;x<W;x+=7){

        const px =
            ((x -
              cameraX*0.9)
             % 320 + 320)%320;

        ctx.fillRect(
            px,
            91,
            2,
            4
        );

    }

}

/* =========================================================
   TRACK
========================================================= */

function drawTrack(){

    ctx.fillStyle="#c48b52";

    ctx.fillRect(
        0,
        107,
        W,
        51
    );

    /* lanes */

    ctx.fillStyle="#9b673d";

    for(let y=119;y<158;y+=13){

        ctx.fillRect(
            0,
            y,
            W,
            1
        );

    }

    /* track texture */

    ctx.fillStyle="#d9a267";

    for(let i=0;i<45;i++){

        const x =
            ((i*43 -
              cameraX)
             % 340 + 340)%340;

        const y =
            109 +
            ((i*17)%45);

        ctx.fillRect(
            x,
            y,
            4,
            1
        );

    }

}

/* =========================================================
   RAMPS
========================================================= */

function drawRamps(){

    for(const r of ramps){

        const x =
            Math.floor(
                r.x-cameraX
            );

        if(
            x > W ||
            x+r.width < 0
        ){
            continue;
        }

        /* ramp shadow */

        ctx.fillStyle="#805331";

        ctx.fillRect(
            x,
            GROUND+2,
            r.width,
            3
        );

        /* ramp body */

        ctx.fillStyle="#e0a15c";

        ctx.beginPath();

        ctx.moveTo(
            x,
            GROUND
        );

        ctx.lineTo(
            x+r.width,
            GROUND
        );

        ctx.lineTo(
            x+r.width,
            GROUND-r.height
        );

        ctx.closePath();

        ctx.fill();

        /* dark pixel edge */

        ctx.fillStyle="#70462e";

        ctx.fillRect(
            x,
            GROUND-2,
            r.width,
            2
        );

        /* ramp highlights */

        ctx.fillStyle="#f0bd78";

        for(
            let yy=GROUND-4;
            yy>GROUND-r.height;
            yy-=5
        ){

            const width =
                Math.max(
                    2,
                    ((yy-(GROUND-r.height))
                    /
                    r.height)
                    *r.width
                );

            ctx.fillRect(
                x+r.width-width,
                yy,
                width,
                1
            );

        }

    }

}

/* =========================================================
   TRACK MARKERS
========================================================= */

function drawTrackDetails(){

    for(let x=0;x<W;x+=40){

        const px =
            ((x -
              cameraX*1.0)
             % 360 + 360)%360;

        ctx.fillStyle="#6f482f";

        ctx.fillRect(
            px,
            148,
            8,
            2
        );

    }

}

/* =========================================================
   PIXEL BIKE
========================================================= */

function drawBike(){

    const x =
        Math.floor(
            bike.x-cameraX
        );

    const y =
        Math.floor(
            bike.y
        );

    ctx.save();

    ctx.translate(
        x,
        y-10
    );

    /*
       This is intentionally drawn as a chunky
       original motocross pixel sprite.
    */

    ctx.rotate(
        bike.angle
    );

    /* =====================================================
       SHADOW
    ===================================================== */

    if(bike.onGround){

        ctx.fillStyle="#765033";

        ctx.fillRect(
            -16,
            12,
            35,
            3
        );

    }

    /* =====================================================
       REAR WHEEL
    ===================================================== */

    drawPixelWheel(
        -12,
        7,
        7
    );

    /* =====================================================
       FRONT WHEEL
    ===================================================== */

    drawPixelWheel(
        13,
        7,
        7
    );

    /* =====================================================
       BIKE FRAME
    ===================================================== */

    ctx.fillStyle="#151515";

    ctx.fillRect(
        -9,
        -1,
        17,
        3
    );

        -7,
        -4,
        4,
        8
    );

    ctx.fillRect(
        4,
        -5,
        4,
        9
    );

    ctx.fillRect(
        -7,
        -3,
        12,
        3
    );

        -4,
        -6,
        7,
        3
    );

    /* fuel tank */

    ctx.fillStyle="#e54836";

    ctx.fillRect(
        -2,
        -8,
        10,
        5
    );

    ctx.fillStyle="#f5c66d";

    ctx.fillRect(
        0,
        -8,
        6,
        2
    );

    /* =====================================================
       FRONT FORK
    ===================================================== */

        -5,
        3,
        14
    );

    ctx.fillRect(
        10,
        -7,
        2,
        13
    );

       HANDLEBARS
    ===================================================== */

    ctx.fillStyle="#171717";

    ctx.fillRect(
        7,
        -9,
        9,
        2
    );

    ctx.fillRect(
        14,
        -9,
        2,
        5
    );

    /* =====================================================
       SEAT
    ===================================================== */

    ctx.fillStyle="#202020";

        -10,

        7,

/* =========================================================
   PIXEL WHEEL
========================================================= */

function drawPixelWheel(x,y,r){

    ctx.save();

    ctx.translate(x,y);

    ctx.fillStyle="#151515";

    /* square-ish pixel wheel */

    ctx.fillRect(
        -r+2,
        -r,
        (r*2)-4,
        r*2
    );

    ctx.fillRect(
        -r,
        -r+2,
        r*2,
        (r*2)-4
    );

    /* tire highlight */

    ctx.fillStyle="#303030";

    ctx.fillRect(
        -r+3,
        -1,
        (r*2)-6,
        2
    );

    ctx.fillRect(
        -1,
        -r+3,
        2,
        (r*2)-6
    );

    /* hub */

    ctx.fillStyle="#d9d2b5";

    ctx.fillRect(
        -2,
        -2,
        4,
        4
    );

    ctx.fillStyle="#6c6c6c";

    ctx.fillRect(
        -1,
        -1,
        2,
        2
    );

    ctx.restore();

}

/* =========================================================
   PARTICLES
========================================================= */

function drawParticles(){

    for(const p of particles){

        let color="#e5b16e";

        if(p.type==="spark")
            color="#fff0a8";

        if(p.type==="crash")
            color="#e74b38";

        ctx.fillStyle=color;

        ctx.fillRect(
            Math.floor(p.x),
            Math.floor(p.y),
            2,
            2
        );

    }

}

/* =========================================================
   HUD
========================================================= */

function drawHUD(){

    /* top HUD */

    ctx.fillStyle="#080808";

    ctx.fillRect(
        0,
        0,
        W,
        16
    );

    ctx.fillStyle="#eee4bd";

    ctx.font=
        "7px monospace";

    ctx.fillText(
        "SCORE",
        6,
        7
    );

    ctx.fillText(
        pad(
            Math.max(
                0,
                Math.floor(score)
            ),
            6
        ),
        6,
        14
    );

    ctx.fillText(
        "BONEZ",
        100,
        7
    );

    ctx.fillText(
        bonez+"/5",
        100,
        14
    );

    ctx.fillText(
        "DIST",
        200,
        7
    );

    ctx.fillText(
        pad(
            Math.floor(
                distance/10
            ),
            5
        ),
        200,
        14
    );

    /* trick indicator */

    if(bike.airborne){

        ctx.fillStyle="#e43b32";

        ctx.font=
            "8px monospace";

        const rotations =
            bike.trickRotation /
            (Math.PI*2);

        ctx.fillText(
            "SPIN "+
            Math.floor(
                rotations*360
            )+"°",
            260,
            14
        );

    }

    /* bottom retro HUD */

    ctx.fillStyle="#080808";

    ctx.fillRect(
        0,
        166,
        W,
        14
    );

    ctx.fillStyle="#aaa";

    ctx.font=
        "6px monospace";

    ctx.fillText(
        "LEFT / RIGHT = LEAN",
        6,
        175
    );

    ctx.fillText(
        "▲ JUMP",
        135,
        175
    );

    ctx.fillText(
        "★ TRICK",
        215,
        175
    );

}

/* =========================================================
   NUMBER PAD
========================================================= */

function pad(number,length){

    return String(number)
        .padStart(length,"0");

}

/* =========================================================
   GAME LOOP
========================================================= */

function loop(time){

    if(!lastTime)
        lastTime = time;

    const dt =
        Math.min(
            time-lastTime,
            50
        );

    lastTime = time;

    update(dt);

    draw();

    requestAnimationFrame(loop);

}

requestAnimationFrame(loop);

/* =========================================================
   INITIAL DRAW
========================================================= */

draw();

</script>
