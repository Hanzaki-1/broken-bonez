
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Broken Bonez Mobile</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;min-height:100%;
  background:#11101c;color:white;font-family:monospace;
  overflow-x:hidden;touch-action:pan-y;
}
#cabinet{width:100%;max-width:1000px;margin:auto;padding:8px}
h1{
  color:#ffe65a;text-align:center;font-size:clamp(24px,6vw,40px);
  letter-spacing:3px;text-shadow:3px 3px #c3394d;margin:8px 0;
}
#subtitle{text-align:center;color:#aaa;font-size:11px;margin-bottom:10px}
#screen{
  position:relative;width:100%;overflow:hidden;
  border:3px solid #66516f;background:#91d6e8;
}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
#overlay{
  position:absolute;inset:0;display:flex;
  flex-direction:column;align-items:center;justify-content:center;
  gap:12px;background:#100f20e8;padding:18px;text-align:center;
}
#overlay h2{color:#ffe65a;font-size:clamp(24px,7vw,38px);margin:0}
#overlay p{font-size:13px;line-height:1.7;max-width:400px}
button{
  font-family:monospace;font-weight:bold;cursor:pointer;
  border:2px solid white;border-radius:10px;
  background:#f3cf45;color:#171323;padding:14px;
  font-size:14px;touch-action:none;user-select:none;
  -webkit-user-select:none;
}
#start{padding:15px 20px;box-shadow:3px 3px #b34759}
#hud{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:4px;padding:9px 4px;background:#211b32;
  border:2px solid #66516f;border-top:0;
}
.stat{text-align:center;color:#c8bfd9;font-size:10px}
.stat strong{display:block;color:#ffe65a;font-size:clamp(15px,4vw,20px);margin-top:6px}
#controls{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:7px;margin:12px 0;
}
#controls button{
  min-width:0;width:100%;min-height:66px;padding:6px 2px;
  background:#4b3967;color:white;font-size:clamp(10px,2.8vw,14px);
  box-shadow:0 4px #302440;
}
#controls button.active{background:#f3cf45;color:#171323;transform:translateY(2px);box-shadow:0 2px #302440}
.help{text-align:center;font-size:11px;color:#c8bfd9;line-height:1.8;margin-bottom:12px}
</style>
</head>
<body>
<div id="cabinet">
<h1>BROKEN BONEZ</h1>
<div id="subtitle">MOBILE MOTOCROSS ARCADE</div>

<div id="screen">
<canvas id="game" width="960" height="540"></canvas>
<div id="overlay">
<h2 id="overlayTitle">BROKEN BONEZ</h2>
<p id="overlayText">Ride the ramps, perform tricks and land safely. Five broken bones ends the game!</p>
<button id="start">START GAME</button>
</div>
</div>

<div id="hud">
<div class="stat">SCORE<strong id="score">0</strong></div>
<div class="stat">BROKEN BONEZ<strong id="bones">0 / 5</strong></div>
<div class="stat">DISTANCE<strong id="distance">0 m</strong></div>
<div class="stat">AIR TRICKS<strong id="tricks">0</strong></div>
</div>

<div id="controls">
<button data-key="ArrowLeft">◀ LEAN</button>
<button data-key="ArrowRight">LEAN ▶</button>
<button data-key="Space">⬆ JUMP</button>
<button data-key="ShiftLeft">★ TRICK</button>
</div>

<div class="help">
Hold LEAN gently to adjust your bike angle.<br>
JUMP to launch • TRICK while airborne • Land on both wheels!
</div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const W=canvas.width,H=canvas.height;
const $=id=>document.getElementById(id);

let running=false,ended=false;
let score=0,bones=0,tricks=0,distance=0;
let camera=0,speed=0,frame=0,lastTime=0;
let keys={};
let bike,ramps=[],particles=[];

function reset(){
 score=0;bones=0;tricks=0;distance=0;
 camera=0;speed=0;frame=0;particles=[];
 bike={
  x:150,y:399,vx:0,vy:0,angle:0,angularVelocity:0,
  grounded:true,airTime:0,stuntTime:0,
  trickActive:false,crashed:false,wheelRadius:11
 };
 ramps=[];
 for(let x=360;x<12000;x+=300+Math.random()*150){
  ramps.push({x,height:35+Math.random()*45,width:65+Math.random()*35});
 }
 updateHUD();
}

function groundY(worldX){
 let y=410;
 for(const r of ramps){
  if(worldX>=r.x&&worldX<=r.x+r.width){
   y=410-r.height*((worldX-r.x)/r.width);
  }else if(worldX>r.x+r.width&&worldX<r.x+r.width+40){
   y=410-r.height*(1-(worldX-r.x-r.width)/40);
  }
 }
 return y;
}

function updateHUD(){
 $("score").textContent=Math.floor(score).toLocaleString();
 $("bones").textContent=bones+" / 5";
 $("distance").textContent=Math.floor(distance)+" m";
 $("tricks").textContent=tricks;
}

function drawBackground(){
 ctx.fillStyle="#91d6e8";ctx.fillRect(0,0,W,H);
 ctx.fillStyle="#e4f6f3";
 for(let i=0;i<6;i++){
  let x=((i*205-camera*.15)%1200+1200)%1200-100;
  ctx.fillRect(x,85+i%3*32,60,12);
  ctx.fillRect(x+15,73+i%3*32,38,12);
 }
 ctx.fillStyle="#6cb8a3";ctx.beginPath();ctx.moveTo(0,360);
 for(let x=0;x<=W;x+=20)ctx.lineTo(x,320+Math.sin((x+camera*.25)/85)*25);
 ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();

 for(let i=0;i<15;i++){
  let x=((i*115-camera*.45)%1200+1200)%1200-100;
  ctx.fillStyle="#70543d";ctx.fillRect(x,335,12,55);
  ctx.fillStyle="#267d59";
  ctx.fillRect(x-15,305,42,35);ctx.fillRect(x-7,287,26,25);
 }
}

function drawTrack(){
 ctx.beginPath();ctx.moveTo(0,H);
 for(let x=0;x<=W;x+=4)ctx.lineTo(x,groundY(x+camera));
 ctx.lineTo(W,H);ctx.closePath();
 ctx.fillStyle="#bb8153";ctx.fill();

 ctx.strokeStyle="#f1d58c";ctx.lineWidth=5;ctx.beginPath();
 for(let x=0;x<=W;x+=4){
  const y=groundY(x+camera);
  if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
 }
 ctx.stroke();

 for(const r of ramps){
  const x=r.x-camera;
  if(x<-100||x>W+100)continue;
  ctx.fillStyle="#e6b95e";
  ctx.fillRect(x,groundY(r.x)-5,r.width,7);
 }
}

function drawBike(){
 const b=bike;
 ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.angle);

 if(b.grounded){
  ctx.fillStyle="#65442f";ctx.fillRect(-32,15,65,5);
 }

 for(const x of [-24,24]){
  ctx.beginPath();ctx.arc(x,0,11,0,Math.PI*2);
  ctx.fillStyle="#252332";ctx.fill();
  ctx.strokeStyle="#e8e3c9";ctx.lineWidth=3;ctx.stroke();
  ctx.beginPath();ctx.arc(x,0,3,0,Math.PI*2);
  ctx.fillStyle="#d94b50";ctx.fill();
 }

 ctx.lineWidth=4;ctx.strokeStyle="#e44d45";
 ctx.beginPath();ctx.moveTo(-24,0);ctx.lineTo(-8,-17);
 ctx.lineTo(10,0);ctx.lineTo(24,0);
 ctx.lineTo(8,-17);ctx.lineTo(-8,-17);ctx.stroke();

 ctx.strokeStyle="#282438";ctx.lineWidth=5;
 ctx.beginPath();ctx.moveTo(7,-18);ctx.lineTo(16,-24);
 ctx.moveTo(-14,-19);ctx.lineTo(-5,-23);ctx.stroke();

 ctx.strokeStyle="#3b3155";ctx.lineWidth=9;
 ctx.beginPath();ctx.moveTo(-5,-22);ctx.lineTo(3,-38);
 ctx.lineTo(13,-25);ctx.stroke();

 ctx.fillStyle="#f0b48a";ctx.fillRect(-2,-50,14,13);
 ctx.fillStyle="#ffe15a";ctx.fillRect(-5,-54,19,8);
 ctx.fillStyle="#30223e";ctx.fillRect(8,-48,8,4);

 ctx.strokeStyle="#292840";ctx.lineWidth=6;
 ctx.beginPath();ctx.moveTo(-4,-23);ctx.lineTo(-12,-8);
 ctx.lineTo(0,-4);ctx.stroke();
 ctx.restore();

 if(b.trickActive&&!b.grounded){
  ctx.fillStyle="#fff06a";ctx.font="bold 20px monospace";
  ctx.fillText("TRICK!",b.x-30,b.y-65);
 }
}

function draw(){
 drawBackground();drawTrack();drawBike();

 ctx.fillStyle="#211b32";ctx.fillRect(18,18,175,58);
 ctx.fillStyle="#ffe65a";ctx.font="bold 15px monospace";
 ctx.fillText("BIKE SPEED",30,40);
 ctx.fillStyle="#fff";ctx.font="bold 24px monospace";
 ctx.fillText(Math.max(0,Math.floor(speed*8))+" KM/H",30,65);

 ctx.fillStyle="#211b32";ctx.fillRect(W-190,18,172,48);
 ctx.fillStyle="#ff7070";ctx.font="bold 15px monospace";
 ctx.fillText("BROKEN BONEZ",W-180,38);
 ctx.fillStyle="#fff";ctx.font="bold 20px monospace";
 ctx.fillText("☠ ".repeat(bones)+"♡ ".repeat(5-bones),W-180,59);

 for(const p of particles){
  ctx.fillStyle=p.color;ctx.fillRect(p.x-camera,p.y,p.size,p.size);
 }
}

function crash(){
 if(bike.crashed||ended)return;
 bike.crashed=true;bones++;score-=250;
 for(let i=0;i<16;i++){
  particles.push({
   x:bike.x+camera,y:bike.y,
   vx:(Math.random()-.5)*8,vy:-Math.random()*7,
   size:3+Math.random()*5,
   color:["#ffdf61","#f66b66","#fff"][i%3]
  });
 }
 updateHUD();
 if(bones>=5){
  ended=true;running=false;
  $("overlayTitle").textContent="GAME OVER!";
  $("overlayText").textContent="Five broken bones! Final score: "+Math.floor(score).toLocaleString()+". Try again!";
  $("start").textContent="PLAY AGAIN";
  $("overlay").style.display="flex";
 }else{
  setTimeout(()=>{
   if(ended)return;
   bike.crashed=false;bike.grounded=true;bike.vy=0;
   bike.angle=0;bike.angularVelocity=0;
   bike.y=groundY(bike.x+camera)-bike.wheelRadius;
   speed=0;
  },650);
 }
}

function update(dt){
 if(!running||ended)return;
 frame++;
 const b=bike;
 const left=keys.ArrowLeft||keys.KeyA;
 const right=keys.ArrowRight||keys.KeyD;
 const jump=keys.Space;
 const stunt=keys.ShiftLeft||keys.ShiftRight;
 if(b.crashed)return;

 speed=Math.min(12,speed+(right?0.10:0.035));
 if(left)speed=Math.max(2,speed-.09);
 b.vx=speed;

 if(!b.grounded){
  b.airTime+=dt;

  // GENTLER LEAN: small rotation, capped angle and capped spin speed.
  const maxLean=0.55;
  const leanPower=0.00035;

  if(left)b.angularVelocity-=leanPower*dt;
  if(right)b.angularVelocity+=leanPower*dt;

  b.angularVelocity=Math.max(-0.0025,Math.min(0.0025,b.angularVelocity));
  b.angularVelocity*=Math.pow(0.94,dt/16);

  const nextAngle=b.angle+b.angularVelocity*dt;
  if(nextAngle>maxLean){
   b.angle=maxLean;
   b.angularVelocity=Math.min(0,b.angularVelocity);
  }else if(nextAngle< -maxLean){
   b.angle=-maxLean;
   b.angularVelocity=Math.max(0,b.angularVelocity);
  }else{
   b.angle=nextAngle;
  }

  // Trick behavior retained
  if(stunt&&!b.trickActive){
   b.trickActive=true;b.stuntTime=0;
  }
  if(b.trickActive){
   b.stuntTime+=dt;
   b.angle+=0.007*dt;
   if(b.stuntTime>900){
    b.trickActive=false;
    b.angle=Math.atan2(Math.sin(b.angle),Math.cos(b.angle));
   }
  }

  b.vy+=0.00065*dt;
  b.y+=b.vy*dt;
  camera+=b.vx*dt*.055;
  distance+=b.vx*dt*.002;

  const gy=groundY(b.x+camera)-b.wheelRadius;
  if(b.y>=gy){
   b.y=gy;
   const angle=Math.atan2(Math.sin(b.angle),Math.cos(b.angle));
   const safe=Math.abs(angle)<0.65&&Math.abs(b.angularVelocity)<0.009;
   if(!safe){crash();return;}

   if(b.trickActive||b.stuntTime>0){
    score+=500+Math.floor(Math.abs(b.angle)*600)+Math.floor(b.airTime/4);
    tricks++;
   }else score+=100;

   b.grounded=true;b.vy=0;b.angle=0;
   b.angularVelocity=0;b.airTime=0;
   b.trickActive=false;b.stuntTime=0;
  }
 }else{
  b.y=groundY(b.x+camera)-b.wheelRadius;
  b.angle=0;b.angularVelocity=0;
  camera+=b.vx*dt*.055;
  distance+=b.vx*dt*.002;

  const gx=b.x+camera;
  for(const r of ramps){
   if(gx>=r.x+r.width-4&&gx<=r.x+r.width+10){
    b.grounded=false;b.vy=-0.34-b.vx*.035;
    b.angularVelocity=0;break;
   }
  }

  // Jump unchanged
  if(jump){
   b.grounded=false;b.vy=-0.43-b.vx*.025;
   b.angularVelocity=right?0.002:left?-0.002:0;
  }
 }

 for(const p of particles){
  p.x+=p.vx*dt*.05;p.y+=p.vy*dt*.05;p.vy+=.02*dt;
 }
 particles=particles.filter(p=>p.y<H+100);
 updateHUD();
}

function loop(t){
 const dt=Math.min(32,t-(lastTime||t));
 lastTime=t;update(dt);draw();
 requestAnimationFrame(loop);
}

$("start").addEventListener("click",()=>{
 reset();ended=false;running=true;
 $("overlay").style.display="none";
});

window.addEventListener("keydown",e=>{
 if(["Space","ArrowLeft","ArrowRight","ShiftLeft","ShiftRight"].includes(e.code))e.preventDefault();
 keys[e.code]=true;
});
window.addEventListener("keyup",e=>keys[e.code]=false);
window.addEventListener("blur",()=>keys={});

document.querySelectorAll("[data-key]").forEach(btn=>{
 const key=btn.dataset.key;
 const down=e=>{
  e.preventDefault();
  if(btn.setPointerCapture)btn.setPointerCapture(e.pointerId);
  keys[key]=true;btn.classList.add("active");
 };
 const up=e=>{
  e.preventDefault();keys[key]=false;
  btn.classList.remove("active");
 };
 btn.addEventListener("pointerdown",down);
 btn.addEventListener("pointerup",up);
 btn.addEventListener("pointercancel",up);
 btn.addEventListener("lostpointercapture",up);
});

reset();draw();requestAnimationFrame(loop);
</script>
</body>
</html>
