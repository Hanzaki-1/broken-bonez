<script>
let ramps = [];
let scrollSpeed = 2;

function createRamp() {
  const length = Math.random() * 80 + 40; // random length 40–120px
  const height = Math.random() * 30 + 10; // random height 10–40px
  const x = canvas.width + Math.random() * 200; // random spacing
  ramps.push({x, length, height});
}

function updateRamps() {
  for (let r of ramps) {
    r.x -= scrollSpeed;
  }
  ramps = ramps.filter(r => r.x + r.length > 0);
  if (ramps.length < 5) createRamp();
}

function drawRamps() {
  ctx.fillStyle = 'brown';
  for (let r of ramps) {
    ctx.beginPath();
    ctx.moveTo(r.x, 280);
    ctx.lineTo(r.x + r.length, 280 - r.height);
    ctx.lineTo(r.x + r.length, 280);
    ctx.closePath();
    ctx.fill();
  }
}

function gameLoop() {
  if (!gameRunning) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = 'gray';
  ctx.fillRect(0, 280, 400, 20); // ground

  updateRamps();
  drawRamps();

  player.vy += 0.5;
  player.y += player.vy;
  if (player.y > 250) {
    player.y = 250;
    player.vy = 0;
    player.onBike = true;
  }

  ctx.fillStyle = 'red';
  ctx.fillRect(player.x - 10, player.y - 20, 20, 20);
  ctx.fillStyle = 'gray';
  ctx.fillRect(player.x - 20, player.y, 40, 10);

  requestAnimationFrame(gameLoop);
}
</script>
